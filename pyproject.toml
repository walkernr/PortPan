[project]
name = "portpan"
version = "0.1.0"
description = "Superimpose high-magnification digiscope observations and Live Photo video streams onto wide panoramic canvases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "google-genai>=0.1.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.123",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
portpan = "portpan.pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portpan"]
